version: "3.9"

services:
  app:
    build: .
    container_name: vox_kanban_app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: vox_kanban_db
      DB_USERNAME: vox_user
      DB_PASSWORD: vox_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: vox_kanban_db
    environment:
      POSTGRES_DB: vox_kanban_db
      POSTGRES_USER: vox_user
      POSTGRES_PASSWORD: vox_pass
    ports:
      - "5432:5432"
    volumes:
      - vox_kanban_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox_user -d vox_kanban_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vox_kanban_pg_data: